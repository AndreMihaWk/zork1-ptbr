# Ao criar uma tag v* (ex.: git tag v0.1.0 && git push --tags): testa e cria uma
# Release com o arquivo do jogo para usar em apps de ficção interativa.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Criar a release
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jogo
          path: build

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/zork1-ptbr.z5 "build/zork1-ptbr-${GITHUB_REF_NAME}.z5"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zork I em português ${GITHUB_REF_NAME}" \
            --generate-notes \
            "build/zork1-ptbr-${GITHUB_REF_NAME}.z5#Jogo (Z-machine V5) para Fabularium, Frotz, Gargoyle etc." \
            "build/walkthrough.transcricao.txt#Transcrição do roteiro completo"
