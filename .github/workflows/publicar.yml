# A cada push na main: testa e publica o site na branch gh-pages.
# A pasta pr-preview/ (previews dos Pull Requests) é preservada.
name: Publicar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar no GitHub Pages
    needs: ci
    runs-on: ubuntu-24.04
    # Mesmo grupo dos previews de PR: um envio para a gh-pages por vez.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
          force: false
